<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSI HANZX - FAKE MOBILE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
body{margin:0; min-height:100vh; background:radial-gradient(circle at top,#102a1e,#020202 70%); color:white; font-family:'Orbitron',sans-serif; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.card{width:90%; max-width:420px; background:rgba(15,15,15,0.9); border:1px solid #00ff88; border-radius:24px; padding:30px 24px; box-shadow:0 0 40px rgba(0,255,136,0.25); text-align:center; animation:pop 0.7s ease;}
@keyframes pop{from{transform:scale(0.8) translateY(30px); opacity:0} to{transform:scale(1) translateY(0); opacity:1}}
h1{color:#00ff88; text-shadow:0 0 15px #00ff88; font-size:22px; margin:0;}
h2{font-size:11px; letter-spacing:5px; opacity:0.6; margin:6px 0 0 0;}
.stats{display:flex; justify-content:space-between; margin:20px 0 10px 0; font-size:10px; opacity:0.7;}
.stats span{color:#00ff88;}
.key-box{background:#000; border:1.5px dashed #00ff88; padding:18px; border-radius:14px; font-size:19px; letter-spacing:2px; margin:12px 0; cursor:pointer;}
.key-box.active{border-style:solid; box-shadow:0 0 25px #00ff88; transform:scale(1.06);}
button{width:100%; padding:16px; border:none; border-radius:14px; background:linear-gradient(90deg,#00ff88,#00b86b); font-family:'Orbitron'; font-weight:900; font-size:15px; cursor:pointer; box-shadow:0 0 20px rgba(0,255,136,0.6);}
.whatsapp-btn{margin-top:16px; display:flex; align-items:center; justify-content:center; gap:10px; background:#111; border:1px solid #25D366; padding:12px; border-radius:12px; color:white; text-decoration:none; font-size:12px;}
.toast{position:fixed; bottom:25px; left:50%; transform:translateX(-50%) translateY(120px); background:#00ff88; color:black; padding:12px 28px; border-radius:30px; font-family:Arial; font-weight:900; opacity:0; transition:0.4s; z-index:99;}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1;}
.confetti{position:fixed; width:8px; height:8px; top:-10px; animation:fall 3s linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
</style>
</head>
<body>
<div class="card">
  <h1>SENSI HANZX - FAKE MOBILE</h1>
  <h2>GENERADOR DE KEYS</h2>
  <div class="stats">
    <div>ONLINE: <span id="online">1,284</span></div>
    <div>GENERADAS: <span id="gen">4,392</span></div>
  </div>
  <div style="font-size:10px; opacity:0.5;">Tu Key Activa - Toca para copiar</div>
  <div class="key-box" id="key" onclick="copiarKey()">XXXX-XXXX-XXXX-XXXX</div>
  <button id="btn" onclick="generar()">GENERAR MI KEY</button>
  <a class="whatsapp-btn" href="https://whatsapp.com/channel/0029VbDbQ5YISTkTelvtQF1j" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="20"> CANAL DE WHATSAPP
  </a>
</div>
<div class="toast" id="toast"></div>
<script>
setInterval(()=>{document.getElementById("online").innerText=(1200+Math.floor(Math.random()*200)).toLocaleString();},2000);
let total=4392, currentKey="";
function generar(){
  currentKey="SENSI-HANZX-P4XS";
  const box=document.getElementById("key");
  box.innerText=currentKey; box.classList.add("active");
  total++; document.getElementById("gen").innerText=total.toLocaleString();
  showToast("KEY GENERADA - TOCA PARA COPIAR");
  for(let i=0;i<25;i++){let c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=["#00ff88","#25D366","#fff"][Math.floor(Math.random()*3)];document.body.appendChild(c);setTimeout(()=>c.remove(),3000);}
}
function copiarKey(){
  if(currentKey=="") return;
  navigator.clipboard.writeText(currentKey);
  showToast("¡TU KEY FUE COPIADA CON ÉXITO!");
}
function showToast(t){
  const toast=document.getElementById("toast");
  toast.innerText=t; toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2500);
}
</script>
</body>
</html>
